<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js" integrity="sha384-CjloA8y00+1SDAUkjs099PVfnY2KmDC2BZnws9kh8D/lX1s46w6EPhpXdqMfjK6i" crossorigin="anonymous"></script>
<script src="https://unpkg.com/topojson-client@3.1.0/dist/topojson-client.min.js" integrity="sha384-Ukv1p/xTma6P4/2bY5KzWBw+ydSpXmhCMtyciIQVDJ1RmOxtCYNMF1uXT9T63H67" crossorigin="anonymous"></script>
</head>
<body style="margin:0;background:#FAF8F5">
<svg id="svg" width="900" height="640" viewBox="0 0 900 640"></svg>
<pre id="out" style="font:11px monospace;white-space:pre-wrap"></pre>
<script>
const WANT = ['Saudi Arabia','Jordan','United Arab Emirates','Kuwait','Qatar','Oman','Bahrain','Yemen','Iraq','Egypt','Israel','Syria','Iran','Palestine','Lebanon'];
const CORE = ['Saudi Arabia','Jordan','United Arab Emirates','Kuwait','Qatar','Oman','Bahrain'];
d3.json('https://cdn.jsdelivr.net/npm/world-atlas@2.0.2/countries-110m.json').then(topo => {
  const all = topojson.feature(topo, topo.objects.countries).features;
  const named = {};
  all.forEach(f => { named[f.properties.name] = f; });
  const core = CORE.map(n => named[n]).filter(Boolean);
  const proj = d3.geoMercator().fitExtent([[24,24],[876,616]], {type:'FeatureCollection', features: core});
  const path = d3.geoPath(proj);
  const round = s => s.replace(/-?\d+\.?\d*/g, m => (Math.round(parseFloat(m)*10)/10));
  const res = {missing:[], paths:{}, centroids:{}};
  WANT.forEach(n => {
    const f = named[n];
    if (!f) { res.missing.push(n); return; }
    const d = path(f);
    if (!d) { res.missing.push(n); return; }
    res.paths[n] = round(d);
    const c = proj(d3.geoCentroid(f));
    res.centroids[n] = [Math.round(c[0]), Math.round(c[1])];
  });
  ['Bahrain','Qatar','Kuwait'].forEach(n => { if (named[n]) return; });
  res.markers = {
    'Bahrain': proj([50.55,26.05]).map(Math.round),
    'Qatar': proj([51.2,25.3]).map(Math.round),
    'Kuwait': proj([47.8,29.4]).map(Math.round),
    'Riyadh': proj([46.72,24.69]).map(Math.round),
    'Amman': proj([35.93,31.95]).map(Math.round)
  };
  const svg = d3.select('#svg');
  Object.entries(res.paths).forEach(([n,d]) => {
    svg.append('path').attr('d', d).attr('fill', CORE.includes(n) ? '#2E5DA8' : '#E7E2DA').attr('stroke','#FAF8F5');
  });
  document.getElementById('out').textContent = JSON.stringify({missing:res.missing, sizes:Object.fromEntries(Object.entries(res.paths).map(([k,v])=>[k,v.length]))});
  window.__geo = res;
});
</script>
</body>
</html>
